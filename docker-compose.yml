services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    # Keep the database predictable on an 8 GB host. These are Compose
    # limits (not Swarm-only deploy settings), so they also work on Debian.
    cpus: "0.75"
    mem_limit: 768m
    mem_reservation: 256m
    shm_size: 128m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      - max_wal_size=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    init: true
    cpus: "0.25"
    mem_limit: 128m
    mem_reservation: 16m
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    cpus: "0.75"
    mem_limit: 512m
    mem_reservation: 256m
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ${RACECRAFT_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - telemetry_data:/data/telemetry:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ./services/ingest
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    cpus: "1.25"
    mem_limit: 2g
    mem_reservation: 512m
    env_file:
      - ${RACECRAFT_ENV_FILE:-.env.docker}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FASTF1_CACHE: /data/fastf1-cache
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    command: ["racecraft-ingest"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - fastf1_cache:/data/fastf1-cache
      - telemetry_data:/data/telemetry
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    init: true
    cpus: "0.25"
    mem_limit: 96m
    mem_reservation: 16m
    depends_on:
      web:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    init: true
    cpus: "0.25"
    mem_limit: 96m
    mem_reservation: 16m
    command:
      - --api.dashboard=false
      - --accesslog=false
      - --log.level=WARN
      - --ping=true
      - --ping.entrypoint=web
      - --entrypoints.web.address=:80
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=90s
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=30s
      - --entrypoints.web.transport.respondingTimeouts.idleTimeout=20s
      - --providers.docker=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=false
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "127.0.0.1:3333:80"
    volumes:
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=web", "--entrypoints.web.address=:80"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
  fastf1_cache:
  telemetry_data:
