services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Keep the database predictable on an 8 GB host. These are Compose
    # limits (not Swarm-only deploy settings), so they also work on Debian.
    cpus: "0.75"
    mem_limit: 768m
    mem_reservation: 256m
    shm_size: 128m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      - max_wal_size=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 512m
    mem_reservation: 256m
    env_file:
      - ${RACECRAFT_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - telemetry_data:/data/telemetry:ro

  worker:
    build:
      context: ./services/ingest
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: "1.25"
    mem_limit: 2g
    mem_reservation: 512m
    env_file:
      - ${RACECRAFT_ENV_FILE:-.env.docker}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FASTF1_CACHE: /data/fastf1-cache
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    command: ["racecraft-ingest"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - fastf1_cache:/data/fastf1-cache
      - telemetry_data:/data/telemetry

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 64m
    mem_reservation: 16m
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:3333:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  fastf1_cache:
  telemetry_data:
