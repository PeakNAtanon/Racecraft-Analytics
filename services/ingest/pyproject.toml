[project]
name = "racecraft-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastf1>=3.6,<4", "feedparser>=6.0,<7", "httpx>=0.28.1,<1",
  "pandas>=2.2,<3", "pyarrow>=19,<24", "psycopg[binary]>=3.2,<4"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
racecraft-ingest = "racecraft_ingest.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["racecraft_ingest"]
