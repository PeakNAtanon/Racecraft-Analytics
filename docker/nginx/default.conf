map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

proxy_cache_path /var/cache/nginx/next_static
    levels=1:2
    keys_zone=next_static:10m
    max_size=64m
    inactive=1d
    use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Keep the reverse proxy cheap on a small host while allowing clients to
    # reuse a connection for a burst of navigation/data requests.
    keepalive_timeout 20s;
    keepalive_requests 1000;
    sendfile on;
    tcp_nopush on;

    client_max_body_size 25m;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache next_static;
        proxy_cache_lock on;
        proxy_cache_valid 200 1d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Only upgrade when the client actually requested it. Sending upgrade
        # on every document/API request disables normal connection reuse.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
